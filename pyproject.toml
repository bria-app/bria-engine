[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bria-engine"
version = "0.1.0"
description = "FTGM forecasting engine for bria."
requires-python = ">=3.11"
# Exact pins = the environment the test suite and the thesis experiments ran with
# (audit M-12). pandas, scikit-learn and statsmodels are not imported by the engine.
dependencies = [
"fastapi==0.123.4",
"uvicorn[standard]==0.38.0",
"pydantic==2.12.5",
"pydantic-settings==2.14.0",
"numpy==2.4.4",
"scipy==1.16.3"
]

[project.optional-dependencies]
dev = [
"pytest==9.0.3",
"pytest-asyncio==1.3.0",
"httpx==0.28.1",
"ruff==0.15.20",
"mypy==2.1.0",
"jupyter"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
